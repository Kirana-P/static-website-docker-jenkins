<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Online Shopping</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d6efd;
color:white;
padding:20px 50px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h1{
font-size:30px;
}

nav a{
color:white;
text-decoration:none;
margin-left:25px;
font-size:18px;
}

.hero{
height:450px;
background:linear-gradient(to right,#0d6efd,#6f42c1);
display:flex;
align-items:center;
justify-content:center;
color:white;
text-align:center;
flex-direction:column;
}

.hero h2{
font-size:50px;
margin-bottom:15px;
}

.hero p{
font-size:22px;
margin-bottom:25px;
}

.hero button{
padding:15px 40px;
font-size:18px;
border:none;
background:#ffc107;
border-radius:30px;
cursor:pointer;
font-weight:bold;
}

.hero button:hover{
background:#ffca2c;
}

.products{
padding:60px;
}

.products h2{
text-align:center;
margin-bottom:40px;
font-size:35px;
color:#333;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.15);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card h3{
padding:15px;
}

.price{
padding:0 15px;
color:#0d6efd;
font-size:24px;
font-weight:bold;
}

.card button{
margin:15px;
width:calc(100% - 30px);
padding:12px;
border:none;
background:#198754;
color:white;
font-size:16px;
cursor:pointer;
border-radius:6px;
}

.card button:hover{
background:#157347;
}

footer{
margin-top:60px;
background:#222;
color:white;
padding:25px;
text-align:center;
}

</style>

</head>

<body>

<header>

<h1>🛒 ShopEasy</h1>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Offers</a>
<a href="#">Contact</a>
</nav>

</header>

<section class="hero">

<h2>Big Sale 2026</h2>

<p>Up to 50% OFF on Electronics, Fashion & Accessories</p>

<button>Shop Now</button>

</section>

<section class="products">

<h2>Featured Products</h2>

<div class="grid">

<div class="card">

<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" alt="Phone">

<h3>iPhone 16 Pro</h3>

<div class="price">£999</div>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" alt="Shoes">

<h3>Running Shoes</h3>

<div class="price">£89</div>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" alt="Watch">

<h3>Smart Watch</h3>

<div class="price">£199</div>

<button>Add to Cart</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" alt="Headphones">

<h3>Wireless Headphones</h3>

<div class="price">£149</div>

<button>Add to Cart</button>

</div>

</div>

</section>

<footer>

<h3>ShopEasy © 2026</h3>

<p>Static Shopping Website | Docker | Jenkins | AWS EC2</p>

</footer>

</body>
</html>
